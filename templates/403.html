{% extends 'base.html' %}

{% block title %}403 Forbidden{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 text-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-rose-100">
        <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
            403
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Access Denied</h1>
        <p class="text-sm text-slate-600 mb-6">
            You do not have permission to view this page. Access is restricted to authorized roles only.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="{% url 'root' %}"
                class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-xl text-sm transition">
                Return to My Home
            </a>
            <form action="{% url 'logout' %}" method="post" class="inline">
                {% csrf_token %}
                <button type="submit"
                    class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-xl text-sm transition">
                    Switch Account
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
